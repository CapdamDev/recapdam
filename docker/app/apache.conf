# Apache inside the app container. The host's Apache proxies the public domain to this container.
ServerName localhost
ServerTokens Prod
ServerSignature Off

# Don't use mod_remoteip here: it would replace the proxy's address with the visitor's IP before PHP runs,
# so Laravel would stop trusting X-Forwarded-Proto and generate http:// URLs (mixed content behind HTTPS).
# Laravel reads X-Forwarded-For itself (trustProxies in bootstrap/app.php); the host's Apache logs real IPs.

<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Options -Indexes +FollowSymLinks
        Require all granted
    </Directory>

    # Evidencias are up to 10 MB; leave room for the form data around them.
    LimitRequestBody 15728640

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "SAMEORIGIN"

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
