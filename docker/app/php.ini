; Production PHP settings for the recapdam container.
expose_php = Off
memory_limit = 256M
max_execution_time = 60

; Evidencias (photos/PDFs) are limited to 10 MB in the app.
upload_max_filesize = 12M
post_max_size = 14M

; Code only changes by rebuilding the image, so never re-check files.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16

date.timezone = America/Mexico_City
